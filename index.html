<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Just Right — coming soon</title>
<style>
  :root { --bg:#f6f8f7; --ink:#1f2b29; --accent:#1f4e4a; --muted:#5b6b68; --card:#ffffff; }
  @media (prefers-color-scheme: dark) { :root { --bg:#121816; --ink:#e7eeec; --accent:#7cc4b6; --muted:#9fb0ac; --card:#1b2321; } }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:16px;
         background:var(--bg); color:var(--ink); font:16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  .card { max-width:420px; width:100%; background:var(--card); border-radius:16px; padding:28px 24px;
          box-shadow:0 2px 12px rgba(0,0,0,.08); text-align:center; }
  .bowl { font-size:56px; line-height:1; }
  h1 { margin:12px 0 4px; font-size:28px; color:var(--accent); }
  p { margin:8px 0; color:var(--muted); }
  .tag { display:inline-block; margin-top:12px; padding:4px 10px; border-radius:999px; font-size:13px;
         background:var(--accent); color:var(--card); }
</style>
</head>
<body>
  <main class="card">
    <div class="bowl" aria-hidden="true">🍚</div>
    <h1>Just Right</h1>
    <p>A canteen portion simulation for NTU vendors and students.</p>
    <p>CC0006 Sustainability group project.</p>
    <span class="tag">Test page — game coming soon</span>
  </main>
</body>
</html>
